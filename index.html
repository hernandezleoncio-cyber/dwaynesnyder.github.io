<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dwayne Snyder for City Council</title>

  <style>
    :root {
      --primary-blue: #0a1f44; /* Deep Judicial Navy */
      --accent-red: #d71a21;   /* Campaign Red */
      --white: #ffffff;
      --light-gray: #f4f4f4;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      margin: 0;
      padding: 0;
      color: #333;
      background-color: var(--white);
      text-align: center;
    }

    /* Header Section */
    header {
      background-color: var(--primary-blue);
      color: var(--white);
      padding: 80px 20px 160px 20px; /* Extra bottom padding for the photo overlap */
      border-bottom: 10px solid var(--accent-red);
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.5rem, 8vw, 4rem); /* Responsive font size */
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1;
    }

    .subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 15px;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 5px;
    }

    /* Candidate Photo Styling */
    .hero-container {
      margin-top: -130px; /* This creates the overlap effect */
      position: relative;
      z-index: 10;
    }

    .candidate-img {
      width: 280px;
      height: 280px;
      object-fit: cover;
      border-radius: 50%; /* Circular portrait */
      border: 8px solid var(--white);
      box-shadow: 0px 10px 30px rgba(0,0,0,0.15);
      background-color: #eee;
    }

    /* Content Area */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .headline {
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-blue);
      font-size: 2.2rem;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .divider {
      width: 60px;
      height: 4px;
      background-color: var(--accent-red);
      margin: 20px auto;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #444;
    }

    /* Priorities List Box */
    .priorities-box {
      background-color: var(--light-gray);
      padding: 40px;
      border-radius: 12px;
      margin: 40px 0;
      text-align: left;
      border-left: 5px solid var(--primary-blue);
    }

    .priorities-box h3 {
      font-family: 'Montserrat', sans-serif;
      color: var(--primary-blue);
      text-transform: uppercase;
      margin-top: 0;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      font-size: 1.15rem;
      padding: 12px 0;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    li:last-child { border-bottom: none; }

    li::before {
      content: "★";
      color: var(--accent-red);
      margin-right: 15px;
      font-size: 1.2rem;
    }
